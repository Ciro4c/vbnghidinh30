# Chuẩn slide học thuật (bài giảng). Chỉnh ở đây, không sửa code.
name: "Slide học thuật"
loai: slide
muc_dich: "giao_duc"
font: "Times New Roman"

slide:
  width_in: 13.333        # 16:9
  height_in: 7.5

colors:
  primary: "1F3864"       # xanh đậm: tiêu đề, nền slide mở đầu
  accent: "2E75B6"        # đường kẻ dưới tiêu đề
  text: "222222"
  muted: "6B7280"
  on_primary: "FFFFFF"

title:
  size_pt: 32
  min_size_pt: 24
  left_in: 0.6
  top_in: 0.35
  width_in: 12.1
  height_in: 1.0
  chars_per_line_at_32: 58   # vượt thì tự giảm cỡ chữ
  max_lines: 2               # tiêu đề tối đa 2 dòng; dài hơn thì rút gọn (reader đã tách phần thừa xuống nội dung)

body:
  size_pt: 24             # cấp 1
  sub_size_pt: 20         # cấp 2
  left_in: 0.8
  top_in: 1.65
  width_in: 11.7
  height_in: 5.0
  width_with_image_in: 6.4
  max_bullets: 7          # quá thì tách sang slide "(tiếp)"
  max_lines: 10
  long_item_chars: 180    # đoạn dài hơn thì cảnh báo nên rút gọn

table:
  font_sizes_pt: [18, 16, 14, 12]   # thử từ lớn đến nhỏ, chọn cỡ đầu tiên vừa một slide
  paged_font_pt: 14                 # bảng quá dài: giữ cỡ này và tách thành nhiều slide
  cell_pad_in: 0.08
  row_pad_in: 0.14
  min_col_in: 0.8

image:
  per_slide: 4            # số hình tối đa trên một slide
  gap_in: 0.2
  right_x_in: 7.5         # khung hình bên phải khi slide có cả chữ
  right_w_in: 5.2

footer:
  size_pt: 12

agenda:
  enabled: true
  title: "Nội dung"
  min_items: 3
  max_items: 10

title_slide:
  title_size_pt: 40
  sub_size_pt: 22
